<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film transport comparison</title><style>body{margin:0;background:#111;color:#eee;font:16px system-ui}main{padding:24px}header{display:flex;gap:30px;align-items:center}input{width:60%}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}canvas,video{width:100%;background:#182422}output{display:block;white-space:pre-wrap;font:14px monospace;margin:15px 0}@media(max-width:700px){.views{grid-template-columns:1fr}}</style><main><h1>Generated film: transport comparison</h1><p>Same Seedance source. Drag the slider in both directions; frame cache stays bounded.</p><header><label for="scrub">Film position</label><input id="scrub" type="range" min="0" max="1000" value="0"><button id="sweep">Run forward / reverse sweep</button></header><output id="stats"></output><div class="views"><div><h2>Canvas frame sequence</h2><canvas id="frames" width="1280" height="720"></canvas></div><div><h2>Video currentTime seek</h2><video id="video" muted playsinline preload="auto" src="/films/petal-transition.mp4"></video></div></div></main><script type="module">
import {FrameSequence} from '/src/sequence.mjs';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),video=document.querySelector('video'),input=document.querySelector('input'),output=document.querySelector('output');let p=0,seekStart=0,latencies=[],draws=[],requested=0;const manifest=await fetch('/film-manifest.json').then(r=>r.json());let raf=0;function render(){raf=0;const start=performance.now(),frame=seq.get(p);if(frame)ctx.drawImage(frame,0,0,1280,720);draws.push(performance.now()-start);output.textContent=JSON.stringify({progress:p,frame:seq.drawn,cache:seq.frames.size,pending:seq.pending.size,seekMedianMs:latencies.length?[...latencies].sort((a,b)=>a-b)[Math.floor(latencies.length/2)]:null,seekMaxMs:Math.max(0,...latencies),drawMaxMs:Math.max(0,...draws),requests:requested},null,2)}const seq=new FrameSequence({base:manifest.transition.desktop,count:manifest.transition.count,onReady:()=>{if(!raf)raf=requestAnimationFrame(render)}});function seek(){seekStart=performance.now();video.currentTime=p*Math.max(0,video.duration-.04);requested++}video.addEventListener('seeked',()=>{latencies.push(performance.now()-seekStart);if(Math.abs(video.currentTime-p*(video.duration-.04))>.08)seek();render()});function update(){p=Number(input.value)/1000;if(video.readyState>=1&&!video.seeking)seek();render()}input.addEventListener('input',update);document.querySelector('button').onclick=()=>{const start=performance.now();function sweep(t){const q=(t-start)/10000;input.value=String(Math.round((q<1?q:Math.max(0,2-q))*1000));update();if(q<2)requestAnimationFrame(sweep)}requestAnimationFrame(sweep)};render();addEventListener('pagehide',()=>seq.dispose());
</script></html>
